# Réglage du Traefik fourni par k3s (HelmChartConfig, platform/traefik-config).
# Vague 0 : avant les applications qui reçoivent du trafic.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Paul-Leclercq-Dev/asesoria-gitops.git
    targetRevision: main
    path: platform/traefik-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
