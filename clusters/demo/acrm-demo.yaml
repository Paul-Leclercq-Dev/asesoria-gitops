# Le CRM (Expedita) sur https://app.tramelya.es (phase 4.2b). Remplace la page de
# test « hello » de 4.2a : même espace de noms, même certificat.
# Deux sources :
#   1. le chart charts/acrm, avec les valeurs de la démo ci-dessous ;
#   2. apps/acrm-demo/ : l'espace de noms (étiquettes Pod Security) et les secrets
#      chiffrés SOPS (générés par scripts/acrm-secrets.sh).
# Ordre dans l'Application : espace de noms (-2) → secrets (-1) → base, Redis, Mailpit, certificat (0)
# → migrations (1) → API, worker, front, Ingress (2) → données de démo (après).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acrm-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  # Retirer cette Application de Git supprime aussi ses ressources (base comprise).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Badge d'accès restreint (clusters/demo/project-acrm.yaml, phase 4.3).
  project: acrm
  sources:
    - repoURL: https://github.com/Paul-Leclercq-Dev/asesoria-gitops.git
      targetRevision: main
      path: charts/acrm
      helm:
        releaseName: acrm
        valuesObject:
          host: app.tramelya.es
          image:
            # Version du CRM déployée : changer ce numéro (PR) = déployer une version.
            # Depuis 4.3, la PR est ouverte par release.yml du CRM (« release/vX.Y.Z ») :
            # elle met à jour le tag ET les empreintes ci-dessous. Merger = déployer.
            tag: "0.5.3"
            # Empreinte exacte de chaque image (scannée et signée par release.yml).
            # Vide pour 0.2.0 (publiée avant 4.3) : tirée par tag seulement.
            digests:
              acrm-api-migrator: "sha256:d20829fd0e0ae767ccf09295be7dab87bea343640feca361b4cab9263cc3830d"
              acrm-api-seeder: "sha256:470cb0eed7836642caffc00b7c303cce0c56f3a1ded0c351087c1e08c2d6cefe"
              acrm-api: "sha256:04e56be1d125bf18046dc867a8c148907915b68ed5ecdd5dc9c32cf788e50631"
              acrm-web: "sha256:6653e5d693d29bace446537a510a57853e4483c694f9dfbf2b46a05914045b47"
          config:
            MAIL_FROM: "Expedita (démo) <no-reply@tramelya.es>"
          s3:
            # Sorties de asesoria-infra/envs/demo-data (terraform output).
            endpoint: https://s3.gra.io.cloud.ovh.net
            region: gra
            bucket: tramelya-demo-documents
          seed:
            enabled: true
            scale: 3
    - repoURL: https://github.com/Paul-Leclercq-Dev/asesoria-gitops.git
      targetRevision: main
      path: apps/acrm-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: acrm-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # L'espace de noms est décrit dans apps/acrm-demo/namespace.yaml (vague -2) ;
      # CreateNamespace reste un filet si Argo CD le crée avant de l'avoir lu.
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    # Premier démarrage : la base et le premier téléchargement des images
    # peuvent prendre plusieurs minutes (le Job de migration attend la base).
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
