# Page de test TEMPORAIRE sur https://app.tramelya.es (phase 4.2a) : prouve
# que la chaîne Cloudflare → Traefik → certificat Let's Encrypt fonctionne.
# Remplacée par le CRM en 4.2b (même espace de noms, même certificat).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  # Retirer cette Application de Git supprime aussi ses ressources dans le cluster.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Paul-Leclercq-Dev/asesoria-gitops.git
    targetRevision: main
    path: apps/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: acrm-demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
