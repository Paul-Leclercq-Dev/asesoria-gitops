# Opérateur SOPS : transforme une ressource « SopsSecret » (chiffrée, donc
# publiable dans Git) en Secret Kubernetes ordinaire, à l'intérieur du cluster.
# Il déchiffre avec la clé privée age déposée par bootstrap/install.sh dans
# le secret sops/sops-age-key-file (le « secret zéro », jamais dans Git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://isindir.github.io/sops-secrets-operator/
    chart: sops-secrets-operator
    targetRevision: 0.28.1 # opérateur 0.21.2 (sops 3.13.3), testé avec Kubernetes 1.36
    helm:
      releaseName: sops
      valuesObject:
        image:
          pullPolicy: IfNotPresent
        secretsAsFiles:
          - name: sops-age-key-file
            secretName: sops-age-key-file
            mountPath: /etc/sops-age-key-file
        extraEnv:
          - name: SOPS_AGE_KEY_FILE
            value: /etc/sops-age-key-file/key
        securityContext:
          enabled: true
          container:
            enabled: true
        resources:
          requests: { cpu: 10m, memory: 48Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: sops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
