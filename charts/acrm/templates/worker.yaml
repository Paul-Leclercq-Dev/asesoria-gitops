# Worker BullMQ (même image que l'API, `node dist/worker.js`), rôle acrm_worker,
# SANS secret JWT. Une seule copie : les jobs planifiés ne doivent pas tourner deux fois.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "acrm.labels" (dict "root" $ "component" "worker") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "acrm.selector" (dict "root" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acrm.selector" (dict "root" $ "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "acrm.podSecurity" (dict "root" $) | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "acrm.image" (dict "root" $ "name" "acrm-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/worker.js"]
          {{- include "acrm.envFrom" . | nindent 10 }}
          env:
            {{- include "acrm.dbEnv" (dict "root" $ "secret" .Values.secrets.dbWorker "user" "acrm_worker" "var" "DATABASE_URL") | nindent 12 }}
            {{- include "acrm.redisEnv" . | nindent 12 }}
            - { name: PORT, value: "3001" }
          ports:
            - { name: health, containerPort: 3001 }
          startupProbe:
            httpGet: { path: /v1/health/live, port: health }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /v1/health/ready, port: health }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /v1/health/live, port: health }
            periodSeconds: 30
          {{- include "acrm.containerSecurity" (dict "uid" 1000) | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "acrm.tmpVolume" . | nindent 8 }}
