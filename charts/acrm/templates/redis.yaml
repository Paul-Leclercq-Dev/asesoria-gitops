{{- if .Values.redis.enabled }}
# Redis des files BullMQ (e-mails, rappels). Sans persistance : un redémarrage
# vide les files ; les jobs planifiés sont recréés au démarrage du worker.
# noeviction : recommandé par BullMQ (Redis ne doit jamais jeter un job pour
# faire de la place, il refuse plutôt l'écriture).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "acrm.labels" (dict "root" $ "component" "redis") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "acrm.selector" (dict "root" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acrm.selector" (dict "root" $ "component" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory-policy
            - noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.redis }}, key: password }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            tcpSocket: { port: redis }
          livenessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 10
          {{- include "acrm.containerSecurity" (dict "uid" 999) | nindent 10 }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "acrm.labels" (dict "root" $ "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "acrm.selector" (dict "root" $ "component" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
