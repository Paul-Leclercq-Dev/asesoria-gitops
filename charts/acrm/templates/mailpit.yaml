{{- if .Values.mailpit.enabled }}
# Boîte SMTP de test : l'API y dépose tous ses e-mails, rien ne sort du cluster.
# Interface (non exposée) : kubectl -n <ns> port-forward svc/<release>-mailpit 8025
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mailpit
  labels:
    {{- include "acrm.labels" (dict "root" $ "component" "mailpit") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "acrm.selector" (dict "root" $ "component" "mailpit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acrm.selector" (dict "root" $ "component" "mailpit") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          env:
            - { name: MP_MAX_MESSAGES, value: "500" }
            - { name: TZ, value: Europe/Madrid }
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          readinessProbe:
            tcpSocket: { port: smtp }
          {{- include "acrm.containerSecurity" (dict "uid" 65534) | nindent 10 }}
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "acrm.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mailpit
  labels:
    {{- include "acrm.labels" (dict "root" $ "component" "mailpit") | nindent 4 }}
spec:
  selector:
    {{- include "acrm.selector" (dict "root" $ "component" "mailpit") | nindent 4 }}
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
{{- end }}
