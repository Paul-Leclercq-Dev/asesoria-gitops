name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 # linux-amd64
  K8S_VERSION: 1.36.0

jobs:
  manifests:
    name: secrets chiffrés + manifestes + scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: aucun secret en clair
        run: scripts/check-encrypted.sh
      - name: yamllint
        run: yamllint --strict .
      - name: shellcheck
        run: shellcheck bootstrap/*.sh scripts/*.sh
      - name: installer kubeconform (empreinte vérifiée)
        run: |
          curl -sSfL -o /tmp/kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - name: kubeconform (strict)
        run: scripts/kubeconform.sh

  charts:
    name: helm template + kubeconform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: installer kubeconform (empreinte vérifiée)
        run: |
          curl -sSfL -o /tmp/kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - name: versions des outils (préinstallés sur le runner)
        run: helm version && yq --version
      - name: rendre et valider les charts
        run: scripts/render-charts.sh

  trivy:
    name: trivy (misconfig + secrets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
