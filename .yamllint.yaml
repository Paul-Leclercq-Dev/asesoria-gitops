extends: default
ignore: |
  .backup/
  # Fichiers réécrits par sops (son propre style d'indentation).
  *.sops.yaml
  !.sops.yaml
rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
